# IMD6900 Frens: the art and its renderer, launched through the IMD swarm. Builds offline: every library is vendored
# under lib/ (only the files imported). Any installed solc >= 0.8.26 works (auto-detected): the chunks' code is the art
# itself whatever builds it, and the tests check the renderer's output. bytecode_hash = "none", as IMD's launches require.
[profile.default]
src = "src"
test = "test"
script = "script"
out = "out"
libs = ["lib"]
auto_detect_solc = true
bytecode_hash = "none"
optimizer = true
optimizer_runs = 200
via_ir = true
evm_version = "cancun"
fs_permissions = [{ access = "read", path = "./script/art/data" }]
remappings = [
    "solady/=lib/solady/src/",
    "@uniswap/v4-core/=lib/v4-core/",
    "forge-std/=lib/forge-std/src/",
    "@openzeppelin/contracts/=lib/openzeppelin-contracts/contracts/",
]
